version: 2.1

executors:
  java-executor:
    docker:
      - image: cimg/openjdk:17.0   # CircleCI's official OpenJDK image
    working_directory: ~/repo

  node-executor:
    docker:
      - image: cimg/node:18.17     # CircleCI's official Node.js image
    working_directory: ~/repo

jobs:
  backend-build:
    executor: java-executor
    steps:
      - checkout
      - run:
          name: Build backend with Maven
          command: mvn -B -DskipTests clean package
      - run:
          name: Run backend tests
          command: mvn test
      - persist_to_workspace:
          root: .
          paths:
            - backend-build

  frontend-build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install frontend dependencies
          command: |
            cd frontend
            npm install
      - run:
          name: Run frontend tests
          command: |
            cd frontend
            npm test -- --watchAll=false
      - run:
          name: Build frontend
          command: |
            cd frontend
            npm run build
      - persist_to_workspace:
          root: .
          paths:
            - frontend/build

  integration:
    executor: java-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Integration step
          command: |
            echo "Here you could run integration tests, or package frontend build into backend resources"

workflows:
  version: 2
  build_and_test:
    jobs:
      - backend-build
      - frontend-build
      - integration:
          requires:
            - backend-build
            - frontend-build

